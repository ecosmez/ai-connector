name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aiconn:aiconn@localhost:5432/aiconnector_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Create app role and databases (non-superuser for RLS)
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE aiconn LOGIN PASSWORD 'aiconn' NOSUPERUSER NOBYPASSRLS CREATEDB;
          CREATE DATABASE aiconnector OWNER aiconn;
          CREATE DATABASE aiconnector_test OWNER aiconn;
          SQL
          psql -h localhost -U postgres -d aiconnector_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT ALL ON SCHEMA public TO aiconn;
          ALTER SCHEMA public OWNER TO aiconn;
          SQL
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build shared
        run: pnpm --filter @ai-connector/shared build
      - name: Prisma generate + migrate
        run: |
          pnpm --filter @ai-connector/api prisma:generate
          pnpm --filter @ai-connector/api prisma:migrate
      - name: Typecheck
        run: pnpm typecheck
      - name: Test API
        run: pnpm test
      - name: Build
        run: pnpm build
